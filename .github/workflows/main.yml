name: Quicksilver DLL Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Download CBAS source
        uses: actions/checkout@v4
        with:
          repository: Gazareth/CBAS
          path: CBAS

      - name: Download original OBSE source
        uses: actions/checkout@v4
        with:
          repository: nh2/obse
          path: OBSE_SOURCE

      - name: Install MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Prepare dependencies
        shell: pwsh
        run: |
          $root = "${{ github.workspace }}"
          $source = "$root\OBSE_SOURCE\src"

          New-Item -ItemType Directory -Force `
            -Path "$root\obse" | Out-Null

          New-Item -ItemType Directory -Force `
            -Path "$root\common" | Out-Null

          Copy-Item "$source\obse\*" `
            "$root\obse" -Recurse -Force

          Copy-Item "$source\common\*" `
            "$root\common" -Recurse -Force

          # Create the missing OBSE precompiled header
          $stdafxHeader = "$root\obse\StdAfx.h"

          @'
          #pragma once

          #include <winsock2.h>
          #include <windows.h>
          #include <windowsx.h>
          #include <commctrl.h>
          #include <richedit.h>
          #include <shlobj.h>
          #include <rpc.h>
          #include <dbghelp.h>
          #include <uxtheme.h>
          #include <objbase.h>
          #include <psapi.h>

          #include <time.h>
          #include <intrin.h>
          #include <errno.h>
          #include <malloc.h>
          #include <stdio.h>

          #include <cstdlib>
          #include <cstdio>
          #include <cstring>
          #include <cassert>
          #include <cstdarg>
          #include <cmath>
          #include <algorithm>
          #include <list>
          #include <map>
          #include <vector>
          #include <set>
          #include <queue>
          #include <stack>
          #include <string>
          #include <fstream>
          #include <stdexcept>
          #include <exception>
          #include <sstream>
          #include <memory>
          #include <iostream>
          #include <functional>
          #include <limits>
          '@ | Set-Content -Path $stdafxHeader -Encoding utf8

          # Create the missing source file
          Set-Content -Path "$root\obse\StdAfx.cpp" `
            -Value '#include "stdafx.h"' -Encoding utf8

          Write-Host "Created StdAfx.h and StdAfx.cpp."

          # Fix missing standard string includes
          $headers = @(
            "$root\common\IPipeClient.h",
            "$root\common\IDirectoryIterator.h"
          )

          foreach ($header in $headers) {
            $content = Get-Content $header -Raw

            if ($content -notmatch '#include\s*<string>') {
              Set-Content -Path $header `
                -Value ("#include <string>`r`n" + $content) `
                -Encoding utf8
            }
          }
          # Fix old OBSE va_start reference incompatibility
          $utilitiesHeader = "$root\obse\obse\Utilities.h"
          $utilitiesCpp = "$root\obse\obse\Utilities.cpp"

          $headerContent = Get-Content $utilitiesHeader -Raw

          $oldDeclaration = 'void Show(Message& msg, ...);'

          $newDeclaration = @'
          template <typename... Args>
          void Show(Message& msg, Args... args)
          {
              char msgText[0x400];
              sprintf_s(msgText, sizeof(msgText), msg.fmt, args...);

              if (msg.bCanDisable)
              {
                  if (!msg.bDisabled)
                      if (ShowWarning(msgText))
                          msg.bDisabled = true;
              }
              else
                  ShowError(msgText);
          }
          '@

          if (!$headerContent.Contains($oldDeclaration)) {
            throw "Could not find the old ErrOutput declaration."
          }

          $headerContent = $headerContent.Replace(
            $oldDeclaration,
            $newDeclaration
          )

          if ($headerContent -notmatch '#include\s*<stdio\.h>') {
            $headerContent = $headerContent.Replace(
              '#pragma once',
              "#pragma once`r`n#include <stdio.h>"
            )
          }

          Set-Content $utilitiesHeader $headerContent -Encoding utf8

          $cppContent = Get-Content $utilitiesCpp -Raw

          $pattern = '(?s)void ErrOutput::Show\(ErrOutput::Message& msg, \.\.\.\)\s*\{\s*va_list args;\s*va_start\(args, msg\);\s*vShow\(msg, args\);\s*\}'

          if ($cppContent -notmatch $pattern) {
            throw "Could not find the old ErrOutput::Show implementation."
          }

          $cppContent = [regex]::Replace($cppContent, $pattern, '', 1)

          Set-Content $utilitiesCpp $cppContent -Encoding utf8

          Write-Host "Applied OBSE va_start compatibility fix."
          if (!(Test-Path "$root\obse\obse\GameObjects.cpp")) {
            throw "OBSE source files are missing."
          }

          if (!(Test-Path "$root\common\common.vcxproj")) {
            throw "Common project is missing."
          }

      - name: Diagnose OBSE headers
        shell: pwsh
        run: |
          $root = "${{ github.workspace }}"

          Write-Host "Searching for all GameExtraData.h files..."

          Get-ChildItem $root -Filter GameExtraData.h -Recurse -File |
            ForEach-Object {
              Write-Host ""
              Write-Host "HEADER FOUND: $($_.FullName)"

              Select-String -Path $_.FullName `
                -Pattern 'EntryExtendData|struct Entry\b|class ExtraContainerChanges' |
                ForEach-Object {
                  Write-Host "$($_.LineNumber): $($_.Line.Trim())"
                }
            }

      - name: Prepare output
        shell: pwsh
        run: |
          $root = "${{ github.workspace }}"

          New-Item -ItemType Directory -Force `
            -Path "$root\CBAS\artifacts\data\obse\plugins" |
            Out-Null

          $props = "$root\CBAS\EnvPaths.props"

          $content = Get-Content $props -Raw

          $content = [regex]::Replace(
            $content,
            '<OblivionPath>.*?</OblivionPath>',
            "<OblivionPath>$root\CBAS\artifacts</OblivionPath>"
          )

          Set-Content $props $content
      - name: Locate Quicksilver CBAS source
        shell: pwsh
        run: |
          Write-Host "WORKSPACE:"
          Write-Host $env:GITHUB_WORKSPACE

          Write-Host "SEARCHING FOR CBAS_Actor.cpp:"
          Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -Filter CBAS_Actor.cpp |
            Select-Object -ExpandProperty FullName
      - name: Build original CBAS
        shell: pwsh
        run: |
          msbuild CBAS/CharacterBasedAttackSpeed.sln `
            /p:Configuration=Release `
            /p:Platform=Win32 `
            /p:PlatformToolset=v143 `
            /m

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: Quicksilver-CBAS-Build
          path: CBAS/artifacts/data/obse/plugins/*.dll
