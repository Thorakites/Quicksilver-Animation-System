name: Quicksilver DLL Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Download Quicksilver source
        uses: actions/checkout@v4
        with:
          path: CBAS

      - name: Download xOBSE dependencies
        uses: actions/checkout@v4
        with:
          repository: llde/xOBSE
          path: obse

      - name: Install MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Prepare build folders
        shell: pwsh
        run: |
          $root = "${{ github.workspace }}\CBAS"
          $output = "$root\artifacts"

          New-Item -ItemType Directory -Force `
            -Path "$output\data\obse\plugins" | Out-Null

          $props = Join-Path $root "EnvPaths.props"

          $content = Get-Content $props -Raw

          $content = $content -replace `
            '<OblivionPath>.*?</OblivionPath>', `
            "<OblivionPath>$output</OblivionPath>"

          Set-Content $props $content

      - name: Build original CBAS
        shell: pwsh
        run: |
          msbuild CBAS/CharacterBasedAttackSpeed.sln `
            /p:Configuration=Release `
            /p:Platform=Win32 `
            /p:PlatformToolset=v143 `
            /m

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: Quicksilver-CBAS-Build
          path: CBAS/artifacts/data/obse/plugins/*.dll
